<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><meta name="theme-color" content="#0b0b0d" /><title>
    Manin • Sem conexão</title
  ><style>
    body {
      font: 16px/1.6 system-ui;
      background: #0b0b0d;
      color: #f4f0e7;
      display: grid;
      place-items: center;
      min-height: 90vh;
      margin: 0;
    }
    main {
      max-width: 360px;
      padding: 32px;
      margin: 20px;
      border: 2px solid #f4f0e7;
      box-shadow: 6px 6px 0 #ff1828;
    }
    h1 {
      font-size: 28px;
      text-transform: uppercase;
    }
    a {
      color: #f4f0e7;
      display: inline-block;
      padding: 12px 0;
      text-underline-offset: 5px;
    }
    a:focus-visible {
      outline: 3px solid #ff1828;
      outline-offset: 5px;
    }
  </style>
  <main>
    <h1>Seu espaço é local.</h1>
    <p>
      Após a primeira abertura da versão publicada, o Manin funciona sem
      internet. Seus dados ficam neste dispositivo e navegador. Se a preparação
      inicial ainda não terminou, conecte-se uma vez para carregar o app
      completo.
    </p>
    <a href="/">Abrir meu espaço</a>
  </main>
</html>
